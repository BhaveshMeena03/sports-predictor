# Render Blueprint: the public dashboard as a free static site.
# The backend stays on Fly (it needs a persistent volume for the live
# prediction logs); this is just the client bundle, which talks to it
# directly from the browser.
services:
  - type: web
    name: sports-predictor
    runtime: static
    rootDir: frontend
    # rm -rf: Render reuses the build dir between deploys, and a stale
    # .next/out produced an index.html referencing a chunk hash that was
    # never published — the page rendered but React never hydrated, so no
    # data ever loaded. --webpack because the Turbopack build is what
    # emitted the inconsistent runtime chunk.
    buildCommand: rm -rf .next out && npm ci && npx next build --webpack
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://sports-predictor-api.fly.dev/api
